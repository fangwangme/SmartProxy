# ===================================================================
# Intelligent Proxy Service V3.0 Configuration
# ===================================================================

[server]
port = 6942
# Production uses one Waitress process so in-memory leases and scoring stay coherent.
production_threads = 8
# The launcher waits this deadline plus a small signalling margin.
shutdown_deadline_seconds = 20
background_workers = 8
readiness_min_usable_pool = 1
readiness_validation_max_age_seconds = 600
readiness_flush_max_age_seconds = 180
# Comma-separated list of remote IPs allowed for external APIs and dashboard pages.
# Localhost (127.0.0.1 / ::1) is always allowed automatically.
# Internal-only endpoints (/health, /live, /ready, /metrics, /reload-sources,
# /backup-stats) are localhost-only.
allowed_ips = 192.0.2.10
# Trust X-Forwarded-For only when the direct peer is in trusted_proxy_ips.
trust_proxy_headers = false
trusted_proxy_ips =

[logging]
# Relative paths are resolved from the project root.
log_dir = ./.local/logs
log_file_base_name = proxy

[database]
host = localhost
port = 5432
dbname = proxy_db
user = proxy_user
password = your_password_here
min_connections = 2
max_connections = 50
write_max_retries = 3
write_retry_base_ms = 25

[validator]
# Target website for validating proxy liveness and anonymity.
validation_target = http://httpbin.org/get
# Optional comma-separated targets. A proxy must pass validation_success_threshold targets.
validation_targets = http://httpbin.org/get
validation_success_threshold = 1
# A target is considered reachable after this many successes in a batch. Keep
# this at 1 for small batches; a zero-success sole target fails safe and does
# not deactivate existing proxies or activate pending ones.
validation_target_min_samples = 1
# Validation request timeout in seconds.
validation_timeout_s = 10
# Number of concurrent threads for the validation task.
validation_workers = 100
# Maximum proxies pulled into one validation cycle.
validation_batch_limit = 2000
# Share of validation_batch_limit reserved for never-validated proxies; the rest
# goes to re-checking proxies that are currently alive. Whichever side does not
# use its share donates the remainder to the other. Without this split, a flood
# of freshly fetched proxies starves the liveness re-checks.
validation_new_proxy_ratio = 0.5
# supplement with recent failed proxies.
validation_supplement_threshold = 2000

validation_window_minutes = 30
max_validations_per_window = 5

[scheduler]
# The fixed interval in seconds at which the validation task is triggered.
validation_interval_seconds = 120

stats_flush_interval_seconds = 60

source_refresh_interval_seconds = 300

[fetcher]
# Proxy-list downloads use curl. The validator remains aiohttp-based and is
# unaffected by fetch transport choices.
connect_timeout_s = 30
total_timeout_s = 60
# Retry a failed download before the job is considered failed.
curl_retries = 2
curl_retry_delay_s = 1
# Backoff after a failed fetch: backoff_base_s doubles per consecutive failure,
# capped by the failure class. A reset connection or a timeout is transient and
# tops out at backoff_transient_max_s, so one bad minute cannot lock a source
# out for half an hour; an HTTP 404 or a malformed URL is the source itself
# saying no and waits backoff_max_s.
backoff_base_s = 30
backoff_max_s = 1800
backoff_transient_max_s = 300


[sources]
# [NEW] A comma-separated list of all predefined, valid source names.
predefined_sources = default, insolvencydirect
# [NEW] If a request uses a source not in the list above, it will be mapped to this one.
default_source = default


[source_pool]
# The maximum number of proxies to keep in the ranked tier lists for each
# source. It bounds the tiers, which is what weights the `tiered` strategy; it
# does not decide who may be served. Every live, qualified proxy exploits,
# because the tier lists are recomputed only on a pool sync and a proxy that
# qualifies between syncs would otherwise be stranded.
max_pool_size = 200

stats_pool_max_multiplier = 20

# Selection strategy: uniform, tiered, weighted, or softmax.
# Recommended: softmax. Under "uniform" the score only decides whether a proxy
# makes the top max_pool_size cut, and every proxy inside the pool is then drawn
# with equal probability - the ranking is computed and then thrown away.
weighted_selection_enabled = false
selection_strategy = softmax
# Minimum spacing between trial handouts of the same proxy. It applies to
# discovery/probation/retry traffic only. Exploitation is paced by
# proxy_max_inflight instead: the serving plan is rebuilt on an interval longer
# than any sane cooldown, so filtering the exploit set by it would drop exactly
# the proxies that are getting traffic - the highest-scoring ones - from every
# rebuild. 0 disables it.
proxy_cooldown_ms = 0
# Total exploration budget falls linearly from max to min as the pool becomes
# evaluated. "Evaluated" is measured against the larger of the absolute target
# and a share of the live pool, so a 1200-proxy pool with 110 qualified is read
# as 9% evaluated rather than as finished.
exploration_min_ratio = 0.05
exploration_max_ratio = 0.30
exploration_target_qualified = 50
exploration_target_qualified_ratio = 0.5
# Within the one total budget, discovery receives two thirds by default;
# immediate probation and delayed retries share the remainder.
exploration_discovery_share = 0.6666666667
qualification_min_results = 3
probation_attempts = 3
retry_attempts = 2
retry_delay_seconds = 3600
probation_forgiveness_hours = 48
# A trial candidate is claimed out of the serving plan when handed out and put
# back when feedback arrives, so it cannot be handed out twice before its
# result is known. This timeout releases the claim if feedback never comes.
proxy_inflight_timeout_seconds = 120
# Per-proxy concurrency cap for *qualified* proxies. 0 means unlimited, which
# is the default: a proxy whose success rate is already known does not need its
# requests serialised, and capping it at one would limit the whole service to
# (qualified proxies / round-trip time) requests per second. Raise above 0 only
# if individual proxies are collapsing under concurrent load.
proxy_max_inflight = 0
# Redraws allowed before a saturated plan is rebuilt. Only consulted when
# proxy_max_inflight is set; with the cap off the draw does no checking at all.
exploit_draw_attempts = 4
# How often the serving plan - eligibility, ranking and selection weights - is
# recomputed. It is rebuilt for free on every pool sync; this bounds how stale
# it may get between syncs. get_proxy() only draws from the plan, so this is
# the knob that trades routing freshness against control-plane work, not
# against per-request cost.
serving_plan_max_age_seconds = 2.0
selection_weight_floor = 1.0
softmax_temperature = 14.0
# The number of proxies to place in the high-performance (top) tier.
top_tier_size = 100
# The percentage of requests (0-100) that should be handled by the top tier.
top_tier_load_percentage = 50

# 高质量代理池大小，默认20
premium_pool_size = 20
# 最小使用次数要求，默认50
premium_min_usage_count = 50

# Migration gate for clients that do not yet return allocation_id. Compatibility
# mode preserves legacy behavior but cannot provide exact idempotency and emits
# a counter plus a warning. Set false only after every client has migrated.
allow_legacy_feedback = true
completed_allocation_retention_seconds = 3600
completed_allocation_max = 100000

# Two-speed online reliability. Both estimators start from 5%; every feedback
# event updates them, and score = 100 * min(slow, fast).
reliability_prior = 0.05
reliability_slow_alpha = 0.12
reliability_fast_alpha = 0.30
reliability_decay_half_life_hours = 24
reliability_recent_results_limit = 100
# Counter-only database history is shrunk toward the fixed prior by this weight.
reliability_history_prior_weight = 5
# Latency remains diagnostic and only breaks equal-score ordering.
avg_latency_alpha = 0.3
# Reject feedback latencies above this boundary before they enter persistent
# scoring state. Defaults to one day in milliseconds.
max_feedback_latency_ms = 86400000

# A broad source/client outage only pauses per-proxy reputation after a healthy
# completed window. Aggregate feedback continues in every state.
#
# Every threshold is a multiple of the source's own observed success rate, never
# an absolute ratio: a pool whose normal rate is 10% never produces a window
# that is 50% successful, so an absolute healthy gate can never arm the guard -
# and an absolute 90% failure trigger sits *below* that same pool's normal
# state, so it would fire on healthy traffic.
outage_guard_enabled = true
# Minimum window; the effective window grows until an all-failure run of that
# length is less likely than outage_false_positive_budget under the baseline
# (about 66 observations at a 10% baseline, 3 at 90%), capped by the max.
outage_window_size = 20
outage_window_max_size = 200
outage_min_distinct_proxies = 10
outage_false_positive_budget = 0.001
# EMA weight for the per-source baseline. Outage windows never feed it.
outage_baseline_alpha = 0.2
# Arm after a window reaching half the baseline; fire at a tenth of it; resume
# at three tenths of it.
outage_healthy_baseline_ratio = 0.5
outage_failure_baseline_ratio = 0.1
outage_recovery_baseline_ratio = 0.3


[backup]
stats_backup_enabled = true
stats_backup_interval_seconds = 3600
stats_backup_path = ./.local/data/proxy_stats_backup.json


# ===================================================================
# Dynamic Proxy Source Definitions
# ===================================================================
