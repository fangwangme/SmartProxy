# ===================================================================
# Intelligent Proxy Service V3.0 Configuration
# ===================================================================

[server]
port = 6942
# Comma-separated list of remote IPs allowed for external APIs and dashboard pages.
# Localhost (127.0.0.1 / ::1) is always allowed automatically.
# Internal-only endpoints (/health, /metrics, /reload-sources, /backup-stats) are localhost-only.
allowed_ips = 192.168.1.100
# Trust X-Forwarded-For only when the direct peer is in trusted_proxy_ips.
trust_proxy_headers = false
trusted_proxy_ips =

[logging]
# Relative paths are resolved from the project root.
log_dir = ./.local/logs
log_file_base_name = proxy

[database]
host = localhost
port = 5432
dbname = proxy_db
user = proxy_user
password = your_password_here
max_connections = 50

[validator]
# Target website for validating proxy liveness and anonymity.
validation_target = http://httpbin.org/get
# Optional comma-separated targets. A proxy must pass validation_success_threshold targets.
validation_targets = http://httpbin.org/get
validation_success_threshold = 1
# Validation request timeout in seconds.
validation_timeout_s = 10
# Number of concurrent threads for the validation task.
validation_workers = 100
# Maximum proxies pulled into one validation cycle.
validation_batch_limit = 2000
# Share of validation_batch_limit reserved for never-validated proxies; the rest
# goes to re-checking proxies that are currently alive. Whichever side does not
# use its share donates the remainder to the other. Without this split, a flood
# of freshly fetched proxies starves the liveness re-checks.
validation_new_proxy_ratio = 0.5
# supplement with recent failed proxies.
validation_supplement_threshold = 2000

validation_window_minutes = 30
max_validations_per_window = 5

[scheduler]
# The fixed interval in seconds at which the validation task is triggered.
validation_interval_seconds = 120

stats_flush_interval_seconds = 60

source_refresh_interval_seconds = 300

[fetcher]
# Proxy-list downloads always use curl because this host routes curl and Python
# traffic differently. The validator remains aiohttp-based and is unaffected.
connect_timeout_s = 30
total_timeout_s = 60
# Retry a failed download before the job is considered failed.
curl_retries = 2
curl_retry_delay_s = 1
# Backoff after a failed fetch: backoff_base_s doubles per consecutive failure,
# capped by the failure class. A reset connection or a timeout is transient and
# tops out at backoff_transient_max_s, so one bad minute cannot lock a source
# out for half an hour; an HTTP 404 or a malformed URL is the source itself
# saying no and waits backoff_max_s.
backoff_base_s = 30
backoff_max_s = 1800
backoff_transient_max_s = 300


[sources]
# [NEW] A comma-separated list of all predefined, valid source names.
predefined_sources = default, insolvencydirect
# [NEW] If a request uses a source not in the list above, it will be mapped to this one.
default_source = default


[source_pool]
# [NEW] The maximum number of proxies to keep in the in-memory pool for each source.
max_pool_size = 200

stats_pool_max_multiplier = 20

# Selection strategy: uniform, tiered, weighted, or softmax.
# Recommended: softmax. Under "uniform" the score only decides whether a proxy
# makes the top max_pool_size cut, and every proxy inside the pool is then drawn
# with equal probability - the ranking is computed and then thrown away.
weighted_selection_enabled = false
selection_strategy = softmax
# Minimum delay before the same proxy can be handed out again for the same source.
# Recommended: a non-zero value, so a single proxy cannot absorb a burst of
# requests before any feedback about it has come back.
proxy_cooldown_ms = 500
# Share of requests spent on proxies without unexpired feedback. Never-handed
# proxies are preferred; once every candidate has been tried, exploration
# rotates to the least-recently handed-out candidate. Set to 0 to disable.
exploration_ratio = 0.15
selection_weight_floor = 1.0
softmax_temperature = 14.0
# The number of proxies to place in the high-performance (top) tier.
top_tier_size = 100
# The percentage of requests (0-100) that should be handled by the top tier.
top_tier_load_percentage = 50

# 高质量代理池大小，默认20
premium_pool_size = 20
# 最小使用次数要求，默认50
premium_min_usage_count = 50

# ELO 滑动窗口配置
# 每个代理保留的最大结果数
elo_max_window = 100
# 用于计算分数的结果数
elo_scoring_window = 50
# 是否启用按时间衰减（越旧数据权重越低）
elo_time_decay_enabled = true
# 时间衰减半衰期（小时）
elo_decay_half_life_hours = 24
# 参与评分的最大结果年龄（小时）。超过这个年龄的结果被完全丢弃，
# 代理回落到「未测量基准分」——即当前存活且有观测的代理的分数中位数，
# 不是写死的 50。这个值直接决定「一次失败要多久才能恢复」：
# 单次失败 0h=7.5 分，之后缓慢回爬，到达本阈值时回到基准分。
# 168（7 天）意味着一次失败会把代理压在基线以下整整一周——期间它拿不到
# 流量，也就拿不到翻身需要的 feedback。48（2 天）在惩罚力度和恢复速度之间
# 更平衡，且不影响任何新鲜数据的打分校准。
elo_max_result_age_hours = 48
avg_latency_alpha = 0.3
# 延迟分（满分 30）的标定区间，必须落在这批代理真实的 avg_latency_ms 分布上。
# 目标站响应普遍在 15s~30s，15000/60000 覆盖了真实目标站的响应延迟区间。
latency_full_score_ms = 15000
latency_zero_score_ms = 60000
# Reject feedback latencies above this boundary before they enter persistent
# scoring state. Defaults to one day in milliseconds.
max_feedback_latency_ms = 86400000
# Beta 先验：弱先验对齐基础分布。
# a=0.25, b=0.75 对齐约 10%~25% 的基础成功率分布并保持弱收缩。
elo_prior_successes = 0.25
elo_prior_failures = 0.75
# 新代理在未满 10 次请求前的 consistency 兜底分，默认为 0.0
elo_new_proxy_consistency_bonus = 0.0
# 每次池同步时重算全池分数。关掉的话分数只在收到 feedback 时更新，
# 闲置代理的分数会被永久冻结——时间衰减不生效，被单次失败打下去的代理
# 也再拿不到流量、因此再也不会被重算。
rescore_on_sync_enabled = true


[backup]
stats_backup_enabled = true
stats_backup_interval_seconds = 3600
stats_backup_path = ./.local/data/proxy_stats_backup.json


