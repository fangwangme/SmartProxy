[project]
name = "smartproxy"
version = "3.3.0"
description = "An intelligent, self-adapting proxy pool service"
requires-python = ">=3.14"
dependencies = [
    "flask==3.1.2",
    "flask-cors==6.0.2",
    "psycopg2-binary==2.9.11",
    "aiohttp==3.13.3",
    "aiohttp-socks==0.10.1",
    "loguru==0.7.3",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# SmartProxy is an application, not a library: the import root is the repo root
# (run.py does `from main import main`, scripts/start.sh runs `python -m
# src.main`). Nothing is built or installed for the project itself, so uv sync
# resolves dependencies only.
package = false
