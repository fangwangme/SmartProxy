<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proxy Service Dashboard</title>
  <script>
    // Resolve the theme before first paint so the page never flashes the wrong
    // background. Kept in sync with src/hooks/useTheme.ts.
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('smartproxy-dashboard-theme');
        theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (error) {
        // Storage blocked: fall back to the dark default.
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
